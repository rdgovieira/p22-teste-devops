name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operação a ser executada'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy-hml
          - destroy-prd
          - destroy-both
      lock_id:
        description: 'Lock ID do S3 (opcional, para force-unlock)'
        required: false
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-2' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation == 'deploy'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven and Run Tests
        run: |
          mvn clean test
          mvn package

      - name: Publish Test Results (JUnit)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: target/surefire-reports/TEST-*.xml
          check_run: false
          job_summary: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-reports
          path: target/surefire-reports/

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  security:
    name: Security Scans (Trivy FS)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 & Restore Maven Cache
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy Dependency / Filesystem Scan (CRITICAL only)
        run: |
          trivy fs --offline-scan --ignorefile .trivyignore.yaml --scanners vuln --severity CRITICAL . > trivy_report.txt 2>&1 || true
          cat trivy_report.txt
          trivy fs --offline-scan --ignorefile .trivyignore.yaml --scanners vuln --exit-code 1 --severity CRITICAL .

      - name: Publish Trivy Summary
        if: always()
        run: |
          echo "### Trivy Scan Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy_report.txt

  infrastructure-hml:
    name: Infrastructure (Terraform HML)
    runs-on: ubuntu-latest
    needs: [security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Plan & Apply (HML)
        working-directory: terraform
        run: |
          terraform init
          terraform workspace select -or-create hml
          if [ -n "${{ secrets.LOCK_ID }}" ]; then terraform force-unlock -force ${{ secrets.LOCK_ID }} || true; fi
          terraform plan -var="image_tag=${{ env.IMAGE_TAG }}" -out=tfplan
          terraform apply -auto-approve tfplan

  build-push:
    name: Docker Build & Push ECR
    runs-on: ubuntu-latest
    needs: [infrastructure-hml]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ env.IMAGE_TAG }} .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Trivy Container Image Scan (CRITICAL only)
        run: |
          trivy image --ignorefile .trivyignore.yaml --exit-code 1 --severity CRITICAL my-app:${{ env.IMAGE_TAG }}

      - name: Push Image to ECR (HML & PRD)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # 1. Push para HML
          docker tag my-app:${{ env.IMAGE_TAG }} $ECR_REGISTRY/p22-devops-ecs-fargate-repo-hml:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/p22-devops-ecs-fargate-repo-hml:${{ env.IMAGE_TAG }}

          # 2. Push para PRD (garante criação do repo se necessário)
          aws ecr describe-repositories --repository-names p22-devops-ecs-fargate-repo-prd --region ${{ env.AWS_REGION }} || \
            aws ecr create-repository --repository-name p22-devops-ecs-fargate-repo-prd --region ${{ env.AWS_REGION }} --image-tag-mutability IMMUTABLE || true

          docker tag my-app:${{ env.IMAGE_TAG }} $ECR_REGISTRY/p22-devops-ecs-fargate-repo-prd:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/p22-devops-ecs-fargate-repo-prd:${{ env.IMAGE_TAG }}

  deploy-hml:
    name: Deploy to ECS (HML)
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: hml
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service (HML)
        run: |
          aws ecs update-service --cluster cluster-hml --service app-service-hml --force-new-deployment

  infrastructure-prd:
    name: Infrastructure (Terraform PRD)
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: prd
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Plan & Apply (PRD)
        working-directory: terraform
        run: |
          terraform init
          terraform workspace select -or-create prd
          if [ -n "${{ secrets.LOCK_ID }}" ]; then terraform force-unlock -force ${{ secrets.LOCK_ID }} || true; fi
          terraform plan -var="image_tag=${{ env.IMAGE_TAG }}" -out=tfplan_prd
          terraform apply -auto-approve tfplan_prd

  deploy-prd:
    name: Deploy to ECS (PRD)
    runs-on: ubuntu-latest
    needs: [infrastructure-prd, build-push]
    environment: prd
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service (PRD)
        run: |
          aws ecs update-service --cluster cluster-prd --service app-service-prd --force-new-deployment

  destroy-hml:
    name: Destroy Infrastructure (HML)
    runs-on: ubuntu-latest
    environment: hml
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.operation == 'destroy-hml' || github.event.inputs.operation == 'destroy-both') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Destroy HML Infrastructure
        working-directory: terraform
        run: |
          REPO_NAME="p22-devops-ecs-fargate-repo-hml"
          echo "Forçando exclusão do repositório ECR: $REPO_NAME"
          aws ecr delete-repository --repository-name "$REPO_NAME" --force --region ${{ env.AWS_REGION }} || true
          terraform init
          terraform workspace select -or-create hml
          LOCK_ID="${{ github.event.inputs.lock_id }}"
          if [ -z "$LOCK_ID" ]; then LOCK_ID="${{ secrets.LOCK_ID }}"; fi
          if [ -n "$LOCK_ID" ]; then terraform force-unlock -force "$LOCK_ID" || true; fi
          terraform destroy -auto-approve -var="image_tag=${{ env.IMAGE_TAG }}"

  destroy-prd:
    name: Destroy Infrastructure (PRD)
    runs-on: ubuntu-latest
    environment: prd
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.operation == 'destroy-prd' || github.event.inputs.operation == 'destroy-both') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Destroy PRD Infrastructure
        working-directory: terraform
        run: |
          REPO_NAME="p22-devops-ecs-fargate-repo-prd"
          echo "Forçando exclusão do repositório ECR: $REPO_NAME"
          aws ecr delete-repository --repository-name "$REPO_NAME" --force --region ${{ env.AWS_REGION }} || true
          terraform init
          terraform workspace select -or-create prd
          LOCK_ID="${{ github.event.inputs.lock_id }}"
          if [ -z "$LOCK_ID" ]; then LOCK_ID="${{ secrets.LOCK_ID }}"; fi
          if [ -n "$LOCK_ID" ]; then terraform force-unlock -force "$LOCK_ID" || true; fi
          terraform destroy -auto-approve -var="image_tag=${{ env.IMAGE_TAG }}"
