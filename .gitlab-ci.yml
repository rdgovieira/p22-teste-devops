stages:
  - build-test
  - security
  - infrastructure
  - build-push
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  IMAGE_TAG: $CI_COMMIT_SHA

cache:
  paths:
    - .m2/repository/

build_and_test:
  stage: build-test
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - mvn clean test
    - mvn package
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/*.jar

sast:
  stage: security

dependency_scanning:
  stage: security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - mkdir -p ~/.m2
    - ln -s $(pwd)/.m2/repository ~/.m2/repository || true
    # Falha o pipeline explicitamente apenas em vulnerabilidades CRITICAL nas dependencias
    - trivy fs --exit-code 1 --severity CRITICAL .

tf_plan:
  stage: infrastructure
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init
    - terraform workspace select -or-create hml
    - terraform plan -var="image_tag=$IMAGE_TAG" -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan

tf_apply_hml:
  stage: infrastructure
  needs: ["tf_plan"]
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init
    - terraform workspace select -or-create hml
    - terraform apply -auto-approve tfplan

tf_apply_prd:
  stage: infrastructure
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init
    - terraform workspace select -or-create prd
    - terraform plan -var="image_tag=$IMAGE_TAG" -out=tfplan_prd
    - terraform apply -auto-approve tfplan_prd
  when: manual

docker_push:
  stage: build-push
  needs: ["tf_apply_hml"]
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - apk add --no-cache aws-cli
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    # 1. Build da imagem com a tag do commit
    - docker build -t my-app:$IMAGE_TAG .
    # 2. Container Scanning com Trivy sobre a imagem Docker construida (Quality gate CRITICAL)
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --severity CRITICAL my-app:$IMAGE_TAG
    # 3. Push para o repositorio de HML (ja criado pelo Terraform no stage anterior)
    - docker tag my-app:$IMAGE_TAG $ECR_REGISTRY/p22-devops-ecs-fargate-repo-hml:$IMAGE_TAG
    - docker push $ECR_REGISTRY/p22-devops-ecs-fargate-repo-hml:$IMAGE_TAG
    # 4. Push para o repositorio de PRD (garante existencia e faz push)
    - aws ecr describe-repositories --repository-names p22-devops-ecs-fargate-repo-prd --region $AWS_REGION || aws ecr create-repository --repository-name p22-devops-ecs-fargate-repo-prd --region $AWS_REGION --image-tag-mutability IMMUTABLE || true
    - docker tag my-app:$IMAGE_TAG $ECR_REGISTRY/p22-devops-ecs-fargate-repo-prd:$IMAGE_TAG
    - docker push $ECR_REGISTRY/p22-devops-ecs-fargate-repo-prd:$IMAGE_TAG

deploy_hml:
  stage: deploy
  environment: hml
  needs: ["docker_push"]
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - aws ecs update-service --cluster cluster-hml --service app-service-hml --force-new-deployment
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_prd:
  stage: deploy
  environment: prd
  needs: ["tf_apply_prd", "docker_push"]
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - aws ecs update-service --cluster cluster-prd --service app-service-prd --force-new-deployment
  when: manual